name: EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version veröffentlichen (z. B. 2.1.0) – leer lassen für einen Test-Build"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer bestimmen
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [[ -n "$VERSION" ]]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version muss die Form 1.2.3 haben (war: $VERSION)"; exit 1
            fi
            sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "setup_version=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"
          grep -m1 '^version' Cargo.toml

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Bauen
        run: cargo build --release

      - name: pdfium bereitstellen und Programmordner zusammenstellen
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium
          New-Item -ItemType Directory -Force dist\PDF-Ablage | Out-Null
          Copy-Item target\release\PDF-Ablage.exe dist\PDF-Ablage\
          Copy-Item pdfium\bin\pdfium.dll dist\PDF-Ablage\
          Copy-Item pdfium\LICENSE dist\PDF-Ablage\pdfium-LICENSE.txt -ErrorAction SilentlyContinue
          Get-ChildItem dist\PDF-Ablage | Format-Table Name, Length

      - name: End-to-End-Test (Drucker einrichten, Dokumentname, Ausdruck, Entfernen)
        shell: pwsh
        env:
          PDF_ABLAGE_NO_GUI: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist\PDF-Ablage\PDF-Ablage.exe').Path
          $tmp = $env:RUNNER_TEMP
          function Run-App([string[]]$a) {
            $p = Start-Process $exe -ArgumentList $a -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$tmp\out.txt" -RedirectStandardError "$tmp\err.txt"
            Get-Content "$tmp\out.txt", "$tmp\err.txt" -ErrorAction SilentlyContinue | ForEach-Object { "  | $_" }
            if ($p.ExitCode -ne 0) { throw "PDF-Ablage $($a -join ' ') -> Exit $($p.ExitCode)" }
          }
          $log = "$env:ProgramData\PDFDrucker\pdf_drucker.log"

          Set-Service Spooler -StartupType Automatic
          Start-Service Spooler

          # Zweiter Drucker als Ziel für den automatischen Ausdruck
          $druckOut = "$tmp\testdruck.pdf"
          $drv = (Get-PrinterDriver | Where-Object { $_.Name -like '*Print*PDF*' } | Select-Object -First 1).Name
          Add-PrinterPort -Name $druckOut
          Add-Printer -Name 'Testdrucker' -DriverName $drv -PortName $druckOut

          "== Selbsttest (pdfium) =="
          Run-App @('selftest')

          "== Drucker einrichten =="
          $ziel = "$tmp\ziel"
          Run-App @('install', '--ordner', $ziel)
          $pr = Get-Printer -Name 'PDF-Ablage'
          "Anschluss: $($pr.PortName)"
          if ($pr.PortName -ne '\\.\pipe\PDFAblage') { throw 'Drucker nutzt nicht die Pipe' }

          $cfgFile = "$env:ProgramData\PDFDrucker\config.json"
          $cfg = Get-Content $cfgFile -Raw | ConvertFrom-Json
          $cfg.print_after_save = $true
          $cfg.print_printer = 'Testdrucker'
          $cfg | ConvertTo-Json | Set-Content $cfgFile -Encoding utf8

          function Wait-Files([int]$count, [int]$seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              $f = @(Get-ChildItem $ziel -Filter '*.pdf' -ErrorAction SilentlyContinue)
              if ($f.Count -ge $count) { break }
              Start-Sleep 1
            }
            @(Get-ChildItem $ziel -Filter '*.pdf' -ErrorAction SilentlyContinue)
          }

          "== 5 Dokumente gleichzeitig drucken =="
          $namen = 1..5 | ForEach-Object { "Schnelltest$_" }
          foreach ($n in $namen) { Run-App @('make-test-pdf', "$tmp\$n.pdf") }
          $w = Start-Process $exe -ArgumentList 'run' -PassThru -NoNewWindow
          Start-Sleep 2
          $jobs = foreach ($n in $namen) {
            Start-Process $exe -ArgumentList @('print', "$tmp\$n.pdf", 'PDF-Ablage') -PassThru -NoNewWindow `
              -RedirectStandardOutput "$tmp\$n.out" -RedirectStandardError "$tmp\$n.err"
          }
          $jobs | Wait-Process -Timeout 60
          $files = Wait-Files 5 60
          for ($i = 0; $i -lt 40 -and -not (Test-Path $druckOut); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          "Im Zielordner:"; $files | ForEach-Object { "  $($_.Name)  ($($_.Length) Bytes)" }
          foreach ($n in $namen) {
            $hits = @($files | Where-Object { $_.Name -like "*_$n.pdf" -or $_.Name -like "*_${n}_*.pdf" })
            if ($hits.Count -ne 1) { throw "$n kam $($hits.Count)-mal an (erwartet: 1)" }
            $kopf = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($hits[0].FullName)[0..3])
            if ($kopf -ne '%PDF') { throw "$($hits[0].Name) ist keine gültige PDF" }
          }
          if ($files.Count -ne 5) { throw "Erwartet 5 PDFs, gefunden $($files.Count)" }
          Write-Output "::notice title=Schnelldruck::5 von 5 Dokumenten mit richtigem Namen angekommen"
          if (-not (Test-Path $druckOut)) { throw 'Automatischer Ausdruck ist nicht angekommen' }
          Write-Output "::notice title=Ausdruck::$((Get-Item $druckOut).Length) Bytes an 'Testdrucker'"

          "== Drucken, während die App nicht läuft =="
          Stop-Process $w -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          Run-App @('make-test-pdf', "$tmp\Offlinetest.pdf")
          Run-App @('print', "$tmp\Offlinetest.pdf", 'PDF-Ablage')
          Start-Sleep 5
          "Warteschlange ohne App:"; Get-PrintJob -PrinterName 'PDF-Ablage' | Format-Table Id, DocumentName, JobStatus
          $w = Start-Process $exe -ArgumentList 'run' -PassThru -NoNewWindow
          $files = Wait-Files 6 90
          if (@($files | Where-Object Name -like '*Offlinetest*').Count -eq 1) {
            Write-Output "::notice title=Ohne laufende App::Auftrag wartete in der Warteschlange und kam nach dem Start an"
          } else {
            Write-Output "::warning title=Ohne laufende App::Auftrag kam nach dem Start nicht innerhalb von 90 s an"
          }
          Stop-Process $w -Force -ErrorAction SilentlyContinue
          "Warteschlange danach:"; Get-PrintJob -PrinterName 'PDF-Ablage' | Format-Table Id, DocumentName, JobStatus
          "== Protokoll =="
          Get-Content $log -ErrorAction SilentlyContinue | ForEach-Object { "  | $_" }

          "== Tray-App starten (darf nicht abstürzen) =="
          $t = Start-Process $exe -PassThru
          Start-Sleep 5
          if ($t.HasExited) { throw "Tray-App hat sich beendet (Exit $($t.ExitCode))" }
          Stop-Process $t -Force
          "Tray-App lief 5 Sekunden stabil."

          "== Drucker entfernen =="
          Run-App @('uninstall')
          if (Get-Printer -Name 'PDF-Ablage' -ErrorAction SilentlyContinue) { throw 'Drucker wurde nicht entfernt' }

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installer bauen
        shell: pwsh
        run: '& $env:ISCC "/DMyAppVersion=${{ steps.ver.outputs.setup_version }}" installer\pdf-ablage.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Ablage-Setup
          path: dist/PDF-Ablage-Setup.exe

      - name: Release veröffentlichen
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PDF-Ablage ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/PDF-Ablage-Setup.exe
          generate_release_notes: true
