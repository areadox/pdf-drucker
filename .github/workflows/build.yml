name: EXE bauen

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version veröffentlichen (z. B. 2.1.0) – leer lassen für einen Test-Build"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer bestimmen
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [[ -n "$VERSION" ]]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version muss die Form 1.2.3 haben (war: $VERSION)"; exit 1
            fi
            sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "setup_version=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"
          grep -m1 '^version' Cargo.toml

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Bauen
        run: cargo build --release

      - name: pdfium bereitstellen und Programmordner zusammenstellen
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          New-Item -ItemType Directory -Force pdfium | Out-Null
          tar -xzf pdfium.tgz -C pdfium
          New-Item -ItemType Directory -Force dist\PDF-Ablage | Out-Null
          Copy-Item target\release\PDF-Ablage.exe dist\PDF-Ablage\
          Copy-Item pdfium\bin\pdfium.dll dist\PDF-Ablage\
          Copy-Item pdfium\LICENSE dist\PDF-Ablage\pdfium-LICENSE.txt -ErrorAction SilentlyContinue
          Get-ChildItem dist\PDF-Ablage | Format-Table Name, Length

      - name: End-to-End-Test (mehrere Drucker, Dokumentnamen, Ausdruck, Umbenennen, Entfernen)
        shell: pwsh
        env:
          PDF_ABLAGE_NO_GUI: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist\PDF-Ablage\PDF-Ablage.exe').Path
          $tmp = $env:RUNNER_TEMP
          function Run-App([string[]]$a) {
            $p = Start-Process $exe -ArgumentList $a -Wait -PassThru -NoNewWindow `
                 -RedirectStandardOutput "$tmp\out.txt" -RedirectStandardError "$tmp\err.txt"
            Get-Content "$tmp\out.txt", "$tmp\err.txt" -ErrorAction SilentlyContinue | ForEach-Object { "  | $_" }
            if ($p.ExitCode -ne 0) { throw "PDF-Ablage $($a -join ' ') -> Exit $($p.ExitCode)" }
          }
          function Files($dir) { @(Get-ChildItem $dir -Filter '*.pdf' -ErrorAction SilentlyContinue) }
          function Wait-Files($dir, [int]$count, [int]$seconds) {
            for ($i = 0; $i -lt $seconds -and (Files $dir).Count -lt $count; $i++) { Start-Sleep 1 }
            Files $dir
          }
          function Check-Names($files, $namen) {
            foreach ($n in $namen) {
              $hits = @($files | Where-Object { $_.Name -like "*_$n.pdf" })
              if ($hits.Count -ne 1) { throw "$n kam $($hits.Count)-mal an (erwartet: 1)" }
              $kopf = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($hits[0].FullName)[0..3])
              if ($kopf -ne '%PDF') { throw "$($hits[0].Name) ist keine gültige PDF" }
            }
            if ($files.Count -ne $namen.Count) { throw "Erwartet $($namen.Count) PDFs, gefunden $($files.Count)" }
          }
          function Print-All($namen, $drucker) {
            foreach ($n in $namen) { Run-App @('make-test-pdf', "$tmp\$n.pdf") }
            foreach ($n in $namen) {
              # Argumente selbst in Anführungszeichen setzen (Start-Process tut das bei Leerzeichen nicht)
              Start-Process $exe -ArgumentList "print `"$tmp\$n.pdf`" `"$drucker`"" -PassThru -NoNewWindow `
                -RedirectStandardOutput "$tmp\$n.out" -RedirectStandardError "$tmp\$n.err"
            }
          }
          $log = "$env:ProgramData\PDFDrucker\pdf_drucker.log"
          $cfgFile = "$env:ProgramData\PDFDrucker\config.json"
          function Edit-Config([scriptblock]$change) {
            $cfg = Get-Content $cfgFile -Raw | ConvertFrom-Json
            & $change $cfg
            $cfg | ConvertTo-Json -Depth 10 | Set-Content $cfgFile -Encoding utf8
          }
          function Our-Printers { @(Get-Printer | Where-Object { $_.PortName -like '\\.\pipe\PDFAblage*' }) }

          Set-Service Spooler -StartupType Automatic
          Start-Service Spooler

          # Echter Drucker als Ziel für den automatischen Ausdruck
          $druckOut = "$tmp\testdruck.pdf"
          $drv = (Get-PrinterDriver | Where-Object { $_.Name -like '*Print*PDF*' } | Select-Object -First 1).Name
          Add-PrinterPort -Name $druckOut
          Add-Printer -Name 'Testdrucker' -DriverName $drv -PortName $druckOut

          "== Selbsttest (pdfium) =="
          Run-App @('selftest')

          "== Alte Einstellungen (Version 2.1) werden übernommen =="
          New-Item -ItemType Directory -Force "$env:ProgramData\PDFDrucker" | Out-Null
          $ziel1 = "$tmp\ziel1"
          @{ printer_name = 'PDF-Ablage'; target_dir = $ziel1; filename_pattern = '{datum}_{zeit}_{titel}';
             print_after_save = $true; print_printer = 'Testdrucker'; notify = $true } |
            ConvertTo-Json | Set-Content $cfgFile -Encoding utf8
          Run-App @('install')
          $cfg = Get-Content $cfgFile -Raw | ConvertFrom-Json
          if ($cfg.printers.Count -ne 1 -or $cfg.printers[0].target_dir -ne $ziel1 -or -not $cfg.printers[0].print_after_save) {
            throw "Alte Einstellungen nicht übernommen: $($cfg | ConvertTo-Json -Depth 5)"
          }
          "Übernommen: $($cfg.printers[0].name) -> $($cfg.printers[0].target_dir)"

          "== Zweiten und dritten Drucker hinzufügen =="
          $ziel2 = "$tmp\ziel2"; $ziel3 = "$tmp\ziel3"
          Edit-Config {
            param($c)
            $c.printers += [pscustomobject]@{ id = 2; name = 'PDF-Ablage Rechnungen'; target_dir = $ziel2;
              filename_pattern = 'Rechnung_{titel}'; open_after_save = $false; print_after_save = $false; print_printer = '' }
            $c.printers += [pscustomobject]@{ id = 3; name = 'PDF-Ablage Belege'; target_dir = $ziel3;
              filename_pattern = '{datum}_{titel}'; open_after_save = $false; print_after_save = $false; print_printer = '' }
          }
          Run-App @('sync')
          Our-Printers | Format-Table Name, PortName
          if ((Get-Printer -Name 'PDF-Ablage Rechnungen').PortName -ne '\\.\pipe\PDFAblage-2') { throw 'Drucker 2 falsch eingerichtet' }
          if ((Get-Printer -Name 'PDF-Ablage Belege').PortName -ne '\\.\pipe\PDFAblage-3') { throw 'Drucker 3 falsch eingerichtet' }

          "== Auf allen drei Druckern gleichzeitig drucken =="
          $w = Start-Process $exe -ArgumentList 'run' -PassThru -NoNewWindow
          Start-Sleep 2
          $n1 = 1..5 | ForEach-Object { "Schnelltest$_" }
          $n2 = 1..3 | ForEach-Object { "Rechnung$_" }
          $n3 = 1..2 | ForEach-Object { "Beleg$_" }
          Print-All $n1 'PDF-Ablage'
          Print-All $n2 'PDF-Ablage Rechnungen'
          Print-All $n3 'PDF-Ablage Belege'
          $f1 = Wait-Files $ziel1 5 90; $f2 = Wait-Files $ziel2 3 60; $f3 = Wait-Files $ziel3 2 60
          for ($i = 0; $i -lt 40 -and -not (Test-Path $druckOut); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          foreach ($d in @($ziel1, $ziel2, $ziel3)) { "${d}:"; Files $d | ForEach-Object { "  $($_.Name)" } }
          "Warteschlangen:"; Our-Printers | ForEach-Object { Get-PrintJob -PrinterName $_.Name } | Format-Table PrinterName, Id, DocumentName, JobStatus
          Get-Content $log | Select-String 'WARN|ERROR' | ForEach-Object { "  | $_" }
          Check-Names $f1 $n1
          Check-Names $f2 $n2
          Check-Names $f3 $n3
          if (@($f2 | Where-Object Name -notlike 'Rechnung_*').Count -gt 0) { throw 'Dateiname-Muster von Drucker 2 nicht angewendet' }
          Write-Output "::notice title=Mehrere Drucker::10 von 10 Dokumenten auf 3 Druckern im richtigen Ordner mit richtigem Namen"
          if (-not (Test-Path $druckOut)) { throw 'Automatischer Ausdruck ist nicht angekommen' }

          "== Drucker 3 umbenennen =="
          Edit-Config { param($c) ($c.printers | Where-Object id -eq 3).name = 'PDF-Ablage Quittungen' }
          Run-App @('sync')
          if (Get-Printer -Name 'PDF-Ablage Belege' -ErrorAction SilentlyContinue) { throw 'Alter Name existiert noch' }
          if ((Get-Printer -Name 'PDF-Ablage Quittungen').PortName -ne '\\.\pipe\PDFAblage-3') { throw 'Umbenennen fehlgeschlagen' }
          Stop-Process $w -Force -ErrorAction SilentlyContinue
          $w = Start-Process $exe -ArgumentList 'run' -PassThru -NoNewWindow
          Start-Sleep 2
          Print-All @('Quittung1') 'PDF-Ablage Quittungen'
          $f3 = Wait-Files $ziel3 3 60
          if (@($f3 | Where-Object Name -like '*_Quittung1.pdf').Count -ne 1) { throw 'Druck nach Umbenennen nicht angekommen' }
          "Umbenannt und gedruckt: ok"

          "== Drucker 2 entfernen =="
          Edit-Config { param($c) $c.printers = @($c.printers | Where-Object id -ne 2) }
          Run-App @('sync')
          if (Get-Printer -Name 'PDF-Ablage Rechnungen' -ErrorAction SilentlyContinue) { throw 'Drucker 2 wurde nicht entfernt' }
          Our-Printers | Format-Table Name, PortName

          "== Drucken, während die App nicht läuft =="
          Stop-Process $w -Force -ErrorAction SilentlyContinue
          Start-Sleep 1
          Run-App @('make-test-pdf', "$tmp\Offlinetest.pdf")
          Run-App @('print', "$tmp\Offlinetest.pdf", 'PDF-Ablage')
          Start-Sleep 3
          $w = Start-Process $exe -ArgumentList 'run' -PassThru -NoNewWindow
          $f1 = Wait-Files $ziel1 6 90
          if (@($f1 | Where-Object Name -like '*Offlinetest*').Count -ne 1) { throw 'Auftrag ohne laufende App ging verloren' }
          Write-Output "::notice title=Ohne laufende App::Auftrag wartete in der Warteschlange und kam nach dem Start an"
          Stop-Process $w -Force -ErrorAction SilentlyContinue
          "== Protokoll =="
          Get-Content $log -ErrorAction SilentlyContinue | ForEach-Object { "  | $_" }

          "== Tray-App und Einstellungsfenster starten (dürfen nicht abstürzen) =="
          $t = Start-Process $exe -PassThru
          Start-Sleep 4
          if ($t.HasExited) { throw "Tray-App hat sich beendet (Exit $($t.ExitCode))" }
          Start-Process $exe -ArgumentList 'einstellungen' -Wait
          Start-Sleep 3
          if ($t.HasExited) { throw "Tray-App ist beim Öffnen der Einstellungen abgestürzt (Exit $($t.ExitCode))" }
          Stop-Process $t -Force
          $s = Start-Process $exe -ArgumentList 'einstellungen' -PassThru
          Start-Sleep 4
          if ($s.HasExited) { throw "Einstellungsfenster (eigenständig) hat sich beendet (Exit $($s.ExitCode))" }
          Stop-Process $s -Force
          "Tray-App und Einstellungsfenster liefen stabil."

          "== Alle Drucker entfernen =="
          Run-App @('uninstall')
          if ((Our-Printers).Count -gt 0) { throw 'Drucker wurden nicht entfernt' }

      - name: Bildschirmfoto Einstellungsfenster
        shell: pwsh
        continue-on-error: true
        env:
          PDF_ABLAGE_NO_GUI: "1"
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $exe = (Resolve-Path 'dist\PDF-Ablage\PDF-Ablage.exe').Path
          $s = Start-Process $exe -ArgumentList 'einstellungen' -PassThru
          Start-Sleep 4
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $w = [Math]::Min(800, $b.Width); $h = [Math]::Min(480, $b.Height)
          $x = [int](($b.Width - $w) / 2); $y = [int](($b.Height - $h) / 2)
          $bmp = New-Object System.Drawing.Bitmap $w, $h
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($x, $y, 0, 0, (New-Object System.Drawing.Size $w, $h))
          $bmp.Save("$env:RUNNER_TEMP\einstellungen.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process $s -Force -ErrorAction SilentlyContinue
          "Bildschirm: $($b.Width)x$($b.Height)"
          "BILD-ANFANG"
          [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:RUNNER_TEMP\einstellungen.png")) -split '(.{4000})' | Where-Object { $_ }
          "BILD-ENDE"

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installer bauen
        shell: pwsh
        run: '& $env:ISCC "/DMyAppVersion=${{ steps.ver.outputs.setup_version }}" installer\pdf-ablage.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Ablage-Setup
          path: dist/PDF-Ablage-Setup.exe

      - name: Release veröffentlichen
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PDF-Ablage ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/PDF-Ablage-Setup.exe
          generate_release_notes: true
