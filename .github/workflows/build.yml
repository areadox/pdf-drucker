name: EXE bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer aus Tag setzen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"${VERSION}\"/" pdf_drucker.py
          grep '^APP_VERSION' pdf_drucker.py

      - name: Pakete installieren
        run: python -m pip install "pyinstaller>=6.9" pystray pillow pywin32

      - name: Symbol erzeugen
        run: python pdf_drucker.py make-icon icon.ico

      - name: EXE bauen
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name PDF-Ablage --icon icon.ico
          --hidden-import pystray._win32
          pdf_drucker.py

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Ablage
          path: dist/PDF-Ablage.exe

      - name: Release anlegen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF-Ablage.exe
          generate_release_notes: true
