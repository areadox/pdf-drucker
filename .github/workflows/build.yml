name: EXE bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version veröffentlichen (z. B. 1.1.0) – leer lassen für einen Test-Build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer bestimmen
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [[ -n "$VERSION" ]]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version muss die Form 1.2.3 haben (war: $VERSION)"; exit 1
            fi
            sed -i "s/^APP_VERSION = .*/APP_VERSION = \"${VERSION}\"/" pdf_drucker.py
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          grep '^APP_VERSION' pdf_drucker.py

      - name: Pakete installieren
        run: python -m pip install "pyinstaller>=6.9" pystray pillow pywin32

      - name: Symbol erzeugen
        run: python pdf_drucker.py make-icon icon.ico

      - name: EXE bauen
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name PDF-Ablage --icon icon.ico
          --hidden-import pystray._win32
          pdf_drucker.py

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Ablage
          path: dist/PDF-Ablage.exe

      - name: Release veröffentlichen
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PDF-Ablage ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/PDF-Ablage.exe
          generate_release_notes: true
