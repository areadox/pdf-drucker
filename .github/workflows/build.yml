name: EXE bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Neue Version veröffentlichen (z. B. 1.1.0) – leer lassen für einen Test-Build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer bestimmen
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            VERSION="${VERSION#v}"
          fi
          if [[ -n "$VERSION" ]]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version muss die Form 1.2.3 haben (war: $VERSION)"; exit 1
            fi
            sed -i "s/^APP_VERSION = .*/APP_VERSION = \"${VERSION}\"/" pdf_drucker.py
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "setup_version=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"
          grep '^APP_VERSION' pdf_drucker.py

      - name: Pakete installieren
        run: python -m pip install pyinstaller pystray pillow pywin32 pypdfium2

      - name: Symbol und Versionsinfo erzeugen
        run: |
          python pdf_drucker.py make-icon icon.ico
          python pdf_drucker.py make-versionfile version_info.txt

      - name: Programmordner bauen (PyInstaller, ohne Selbstentpacken)
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed
          --name PDF-Ablage --icon icon.ico
          --version-file version_info.txt
          --hidden-import pystray._win32
          --collect-all pypdfium2 --collect-all pypdfium2_raw
          pdf_drucker.py

      - name: Selbsttest der gebauten EXE (Darstellung + Testdruck)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\testdruck.pdf"
          $druck = ""
          try {
            Set-Service Spooler -StartupType Automatic -ErrorAction Stop
            Start-Service Spooler -ErrorAction Stop
            $drv = (Get-PrinterDriver | Where-Object { $_.Name -like '*Print*PDF*' } | Select-Object -First 1).Name
            Add-PrinterPort -Name $out
            Add-Printer -Name "Testdrucker" -DriverName $drv -PortName $out
            $druck = "Testdrucker"
          } catch {
            Write-Warning "Kein Drucker im Build verfügbar – teste nur die Darstellung: $_"
          }
          $erg = "$env:RUNNER_TEMP\selftest.txt"
          $args_ = @("selftest", "--ergebnis", $erg)
          if ($druck) { $args_ = @("selftest", $druck, "--ergebnis", $erg) }
          $p = Start-Process "dist\PDF-Ablage\PDF-Ablage.exe" -ArgumentList $args_ -Wait -PassThru
          Get-Content $erg
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }
          if ($druck) {
            for ($i = 0; $i -lt 30 -and -not (Test-Path $out); $i++) { Start-Sleep 1 }
            if (-not (Test-Path $out)) { throw "Testdruck ist nicht angekommen" }
            "Testdruck angekommen: $((Get-Item $out).Length) Bytes"
          }

      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Installer bauen
        shell: pwsh
        run: '& $env:ISCC "/DMyAppVersion=${{ steps.ver.outputs.setup_version }}" installer\pdf-ablage.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Ablage-Setup
          path: dist/PDF-Ablage-Setup.exe

      - name: Release veröffentlichen
        if: steps.ver.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PDF-Ablage ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/PDF-Ablage-Setup.exe
          generate_release_notes: true
